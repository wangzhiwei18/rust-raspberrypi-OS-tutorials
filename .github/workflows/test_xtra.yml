name: Xtra-Tests

on:
    push:
        branches:
            - b01
        paths-ignore:
            - "utils/**"
            - "doc/**"
            - "docker/**"
    pull_request:
        branches:
            - b01
        paths-ignore:
            - "utils/**"
            - "doc/**"
            - "docker/**"
    schedule:
        - cron: "0 5 * * *"

jobs:
    build:
        name: Run xtra tests
        runs-on: ubuntu-22.04

        steps:
            - uses: actions/checkout@v3
            - name: Set up Ruby
              uses: ruby/setup-ruby@v1
            - name: Set up Rust
              uses: actions-rust-lang/setup-rust@v1
              with:
                  # 方法1：指定具体版本
                  rust-version: "1.78"
                  # 或方法2：使用稳定版（自动最新）
                  # rust-version: "stable"
                  
                  # 可选：安装额外组件
                  components: rust-src, llvm-tools-preview
                  
                  # 可选：设置默认工具链
                  default: true
            - name: Set up Rust nightly
              run: |
                  cargo install cargo-binutils
            - name: Set up Ruby
              run: |
                  gem install bundler
                  bundle config set without 'uart'
                  bundle install --retry 3
            - name: Run
              run: |
                  bundle exec ruby utils/devtool.rb make_xtra
