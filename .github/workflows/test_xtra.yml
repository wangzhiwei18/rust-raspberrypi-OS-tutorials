name: Xtra-Tests

on:
    push:
        branches:
            - b01
        paths-ignore:
            - "utils/**"
            - "doc/**"
            - "docker/**"
    pull_request:
        branches:
            - b01
        paths-ignore:
            - "utils/**"
            - "doc/**"
            - "docker/**"
    schedule:
        - cron: "0 5 * * *"

jobs:
    build:
        name: Run xtra tests
        runs-on: ubuntu-22.04

        steps:
            - uses: actions/checkout@v3
            - name: Set up Ruby
              uses: ruby/setup-ruby@v1
            - name: Install Rust
            - run: rustup default 1.78
            - name: Set up Rust nightly
              run: |
                  cargo install cargo-binutils
            - name: Set up Ruby
              run: |
                  gem install bundler
                  bundle config set without 'uart'
                  bundle install --retry 3
            - name: Run
              run: |
                  bundle exec ruby utils/devtool.rb make_xtra
